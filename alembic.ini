[alembic]
script_location = migrations
# 접속 정보는 CORIOPS_DATABASE_URL 또는 PGHOST 등 libpq 환경변수로만 받는다.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
