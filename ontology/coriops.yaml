schema_version: '0.2'
language: ko
fhir_reference_version: '4.0.1'
# 0.1-design.2(이전 검토안, 31클래스·24전이)는 docs/archive/ontology-0.1-design.2.yaml에 보존한다(D11).
previous_review: docs/archive/ontology-0.1-design.2.yaml
common_fields:
  id: {type: uuid, primary_key: true}
  created_at: {type: timestamptz}
  updated_at: {type: timestamptz}
conventions:
  timestamps: UTC 저장, Asia/Seoul 표시, Clock 주입
  immutable_tables: 추가만 하며 UPDATE·DELETE·TRUNCATE는 DB 트리거가 거부
  identifiers: chart_no는 속성이며 PK 또는 FK로 사용 금지
  nullable: 필드의 nullable 생략은 false
  enum_storage: PostgreSQL TEXT(+ CHECK)
  status: implemented는 실제 테이블과 시험으로 일치를 검사, planned는 해당 단계에서 구현
  generated_docs: docs/ontology.md·erd.md·state-machine.md·fhir-mapping.md는 scripts/gen_docs.py가 만든다
# 실제 테이블이 있지만 아직 클래스로 나누지 않은 전환기 테이블. Stage A-2에서 정식 테이블로 옮긴다.
transitional_tables:
  ledger_entries: Stage A-2에서 Patient·Exam·Specimen·ExamResult·DoctorReview·FollowUp으로 이전
enums:
  StaffRoleCode: [DOCTOR, ADMIN, NURSE, PRIVACY_OFFICER]
  Sex: [M, F]
  ExamKind: [BIOPSY, CLO, STOOL]
  ProcedureType: [stomach, colon]
  EntrySource: [MANUAL, IMPORT, SEED]
  AccessAction: [LOGIN, LOGOUT, LOGIN_FAIL, DENIED, LIST, VIEW, CREATE, UPDATE, IMPORT, EXPORT, ACCOUNT, LOG_VIEW,
                 LOG_REVIEW]
  ExamStage: [HANDOFF_PENDING, RESULT_PENDING, DOCTOR_PENDING, FOLLOWUP, CLOSED]
  ResultCodeScope: [UPPER_GI, LOWER_GI, ANY]
  ResultSeverityTier: [ROUTINE, ATTENTION, CRITICAL]
  SydneyGrade: [NEG, POS1, POS2, POS3]
  RuleRunStatus: [RUNNING, SUCCEEDED, FAILED]
  TaskStatus: [OPEN, DONE, DISMISSED, AUTO_RESOLVED]
registries:
  result_codes: {source: config/result_codes.yaml, key: codes, owner: endoscopy_pathology}
  result_modifiers: {source: config/result_codes.yaml, key: modifiers, owner: endoscopy_pathology}
  exam_kinds: {source: config/ledger_app.yaml, key: kinds, owner: endoscopy_pathology}
  permissions: {source: config/security.yaml, key: authentication.permissions, owner: kernel}
classes:
  # ---------- kernel: 계정·권한·접속기록 (구현됨, app/kernel/security_db.py)
  Staff:
    status: implemented
    table: staff
    layer: kernel
    fhir: Practitioner
    description: 직원 개인 계정. 공용 계정을 만들지 않는다
    fields:
      username: {type: string, unique: true}
      display_name: {type: string}
      password_hash: {type: string, secret: true}
      active: {type: boolean}
      must_change_password: {type: boolean}
      failed_login_count: {type: integer}
      locked_until: {type: timestamptz, nullable: true}
    constraints: [비밀번호는 argon2id 해시만 저장, 역할은 StaffRole의 복수 행으로 부여]
  StaffRole:
    status: implemented
    table: staff_roles
    layer: kernel
    fhir: PractitionerRole
    description: 직원 1명의 역할 1개. 원장이 DOCTOR와 PRIVACY_OFFICER를 겸할 수 있다
    fields:
      staff_id: {type: uuid, references: Staff, relation: roleOf}
      role: {type: enum, enum: StaffRoleCode}
    unique: [[staff_id, role]]
  PermissionHistory:
    status: implemented
    table: permission_history
    layer: kernel
    fhir: null
    immutable: true
    description: 역할·사용 여부 변경 전후
    fields:
      staff_id: {type: uuid, references: Staff, relation: changesPermissionOf}
      changed_by: {type: uuid, references: Staff, relation: changedBy, nullable: true}
      at: {type: timestamptz}
      before_roles: {type: jsonb}
      after_roles: {type: jsonb}
      before_active: {type: boolean, nullable: true}
      after_active: {type: boolean}
      reason: {type: string}
    constraints: [changed_by가 null이면 서버 명령으로 만든 초기 계정, 최소 3년 보유]
  AuthSession:
    status: implemented
    table: auth_sessions
    layer: kernel
    fhir: null
    description: 로그인 세션. 토큰 원문은 저장하지 않는다
    fields:
      staff_id: {type: uuid, references: Staff, relation: sessionOf}
      token_hash: {type: string, unique: true, secret: true}
      last_activity_at: {type: timestamptz}
      expires_at: {type: timestamptz}
      revoked_at: {type: timestamptz, nullable: true}
  AccessLog:
    status: implemented
    table: access_logs
    layer: kernel
    fhir: AuditEvent
    immutable: true
    description: 누가 언제 어느 대상에 무엇을 했는지 한 줄. 해시 사슬로 변조를 찾는다
    fields:
      sequence_no: {type: bigint, unique: true}
      at: {type: timestamptz}
      actor_id: {type: uuid, references: Staff, relation: performedBy, nullable: true}
      actor_label: {type: string}
      client_ip: {type: string}
      action: {type: enum, enum: AccessAction}
      subject_ref: {type: string, nullable: true}
      target_type: {type: string}
      detail_count: {type: integer, nullable: true}
      outcome: {type: string}
      prev_hash: {type: string}
      hash: {type: string}
    constraints: [subject_ref는 대상 1건(차트번호), 이름·결과·비밀번호 저장 금지, 최소 2년 보유]
  AccessLogReview:
    status: implemented
    table: access_log_reviews
    layer: kernel
    fhir: null
    immutable: true
    description: 개인정보 책임자의 접속기록 점검
    fields:
      reviewer_id: {type: uuid, references: Staff, relation: reviewedBy}
      reviewed_at: {type: timestamptz}
      period_start: {type: timestamptz}
      period_end: {type: timestamptz}
      last_sequence: {type: bigint}
      last_hash: {type: string}
      chain_ok: {type: boolean}
      bulk_alerts: {type: integer}
      note: {type: string}
  # ---------- kernel: 환자 (Stage A-2)
  Patient:
    status: planned
    planned_stage: A-2
    table: patients
    layer: kernel
    fhir: Patient
    description: 차트번호당 1명. 여러 업무 모듈이 함께 쓴다
    fields:
      chart_no: {type: string, unique: true}
      name: {type: string}
      sex: {type: enum, enum: Sex, nullable: true}
    constraints: [같은 차트번호에 다른 이름이 들어오면 덮어쓰지 않고 거부, 주민번호·연락처·주소는 저장하지 않음]
  # ---------- endoscopy_pathology: 조직검체·CLO·Stool 장부
  Exam:
    status: planned
    planned_stage: A-2
    table: exams
    layer: endoscopy_pathology
    fhir: ServiceRequest / Procedure
    description: 검사 1건(조직검사·CLO·Stool). 단계는 저장하지 않고 연결된 기록으로 계산한다
    fields:
      patient_id: {type: uuid, references: Patient, relation: forPatient}
      kind: {type: enum, enum: ExamKind, registry: exam_kinds}
      exam_date: {type: date}
      procedure_type: {type: enum, enum: ProcedureType, nullable: true}
      age: {type: integer, nullable: true}
      report_ref: {type: string, nullable: true}
      source: {type: enum, enum: EntrySource}
      import_batch_id: {type: uuid, references: ImportBatch, relation: importedIn, nullable: true}
      version: {type: integer}
    unique: [[kind, report_ref]]
    constraints: [age는 검사 당시 나이, report_ref는 수탁기관 접수번호, version은 화면 동시 수정 확인용]
  Specimen:
    status: planned
    planned_stage: A-2
    table: specimens
    layer: endoscopy_pathology
    fhir: Specimen
    description: 검사 1건의 검체 묶음과 인계 3자(접수인·인계인·인수인)
    fields:
      exam_id: {type: uuid, references: Exam, relation: collectedIn, unique: true}
      specimen_count: {type: integer, nullable: true}
      site: {type: string}
      handoff_id: {type: uuid, references: Handoff, relation: handedOverIn, nullable: true}
      registered_by: {type: string}
      handed_by: {type: string}
      received_by: {type: string}
      entrusted_on: {type: date, nullable: true}
    constraints: [specimen_count는 1~99병, 인계 시 장부 병 수와 확인 병 수가 같아야 기록]
  ExamResult:
    status: planned
    planned_stage: A-2
    table: exam_results
    layer: endoscopy_pathology
    fhir: DiagnosticReport
    description: 결과 1건. 등록 코드 표기만 저장한다(A11)
    fields:
      exam_id: {type: uuid, references: Exam, relation: resultOf, unique: true}
      reported_on: {type: date, nullable: true}
      result_code: {type: string}
      findings: {type: jsonb, items: ReportFinding}
      sydney: {type: jsonb, items: SydneyGrading}
      review_codes: {type: jsonb}
    constraints: [판독문 원문·자유서술 저장 금지, 조직검사는 findings·CLO·Stool은 20자 이내 판정 result_code,
                  review_codes는 사람이 확인할 표기 문제(미등록 코드 등)]
  DoctorReview:
    status: planned
    planned_stage: A-2
    table: doctor_reviews
    layer: endoscopy_pathology
    fhir: null
    description: 원장 지시 1건(재검 필요 또는 불필요)
    fields:
      exam_id: {type: uuid, references: Exam, relation: reviews, unique: true}
      decided_at: {type: timestamptz}
      decided_by: {type: string, nullable: true}
      no_followup_reason: {type: string}
    constraints: [재검 필요 여부와 날짜는 원장이 정하며 시스템이 추천·계산하지 않음,
                  decided_by가 null이면 Stage A 이전 자료(기록자 미보존)]
  FollowUp:
    status: planned
    planned_stage: A-2
    table: followups
    layer: endoscopy_pathology
    fhir: ServiceRequest
    description: 원장이 정한 재검 계획 1건. Stage C에서 Recall로 일반화한다
    fields:
      review_id: {type: uuid, references: DoctorReview, relation: plannedBy, unique: true}
      due_on: {type: date}
      done_on: {type: date, nullable: true}
      done_by: {type: string, nullable: true}
    constraints: [재검 계획이 있으면 DoctorReview.no_followup_reason은 빈 값, done_on은 오늘 이전]
  Handoff:
    status: implemented
    table: ledger_handoffs
    layer: endoscopy_pathology
    fhir: null
    description: 하루 한 번 이상의 검체 인계. 병 수 대조 결과를 남긴다
    fields:
      handed_at: {type: timestamptz}
      registered_by: {type: string}
      handed_by: {type: string}
      receiver_name: {type: string}
      specimen_count: {type: integer}
      case_count: {type: integer}
  ImportBatch:
    status: implemented
    table: ledger_import_batches
    layer: endoscopy_pathology
    fhir: null
    description: 엑셀 가져오기 1회
    fields:
      committed_at: {type: timestamptz}
      digest: {type: string, unique: true}
      accepted: {type: integer}
      skipped: {type: integer}
      sheet_counts: {type: jsonb}
    constraints: [원본 파일·파일명·비고 열·셀 값 저장 금지, 같은 내용 재저장은 digest로 거부]
  LedgerExport:
    status: implemented
    table: ledger_exports
    layer: endoscopy_pathology
    fhir: null
    description: 지정 원내 폴더로의 엑셀 출력 1회
    fields:
      exported_at: {type: timestamptz}
      file_name: {type: string}
      row_count: {type: integer}
    constraints: [CORIOPS_EXPORT_DIR 안의 새 파일만, 링크·클라우드 동기화 경로 거부]
  # ---------- 결과 표기 구성 요소: 테이블이 아니라 ExamResult의 JSONB 안에 들어간다
  ReportFinding:
    status: implemented
    embedded_in: ExamResult.findings
    layer: endoscopy_pathology
    fhir: DiagnosticReport.conclusionCode
    description: 결과 코드 1개. 예 TA#2(L) = code TA, lesion_count 2, modifiers [L]
    fields:
      code: {type: string, registry: result_codes}
      lesion_count: {type: integer, nullable: true}
      modifiers: {type: jsonb, registry: result_modifiers}
      registered: {type: boolean}
    constraints: [미등록 코드는 registered=false로 보관하고 확인 대상으로 표시(Q19)]
  SydneyGrading:
    status: implemented
    embedded_in: ExamResult.sydney
    layer: endoscopy_pathology
    fhir: Observation
    description: Sydney 표기 HP-/Neu++/Mon++/Atr+/IM-의 구조화
    fields:
      h_pylori: {type: enum, enum: SydneyGrade, nullable: true}
      neutrophil: {type: enum, enum: SydneyGrade, nullable: true}
      mononuclear: {type: enum, enum: SydneyGrade, nullable: true}
      atrophy: {type: enum, enum: SydneyGrade, nullable: true}
      intestinal_metaplasia: {type: enum, enum: SydneyGrade, nullable: true}
    constraints: [위 검체에만 허용, 미기재 항목은 넣지 않으며 NEG로 추정 금지]
  ResultCode:
    status: implemented
    source: config/result_codes.yaml
    layer: endoscopy_pathology
    fhir: CodeSystem.concept
    description: 등록 결과 코드. 화면에서 편집하지 않는다
    fields:
      code: {type: string, unique: true}
      label: {type: string, nullable: true}
      scope: {type: enum, enum: ResultCodeScope, nullable: true}
      severity_tier: {type: enum, enum: ResultSeverityTier, nullable: true}
    constraints: [label·scope·severity_tier는 Q19 약어 사전 확정 전 null,
                  severity_tier는 화면 정렬·강조 전용이며 재검 필요 여부·기한 결정에 사용 금지]
  # ---------- kernel: 규칙·할 일 (Stage B)
  Rule:
    status: planned
    planned_stage: B
    table: rules
    layer: kernel
    fhir: PlanDefinition
    description: 상태·기한·누락을 찾는 규칙 1개. 매개변수는 config/rules.yaml
    fields:
      rule_id: {type: string, unique: true}
      params: {type: jsonb}
      enabled: {type: boolean}
      config_hash: {type: string}
  RuleRun:
    status: planned
    planned_stage: B
    table: rule_runs
    layer: kernel
    fhir: null
    description: 규칙 실행 1회
    fields:
      rule_id: {type: uuid, references: Rule, relation: evaluates}
      evaluated_at: {type: timestamptz}
      finished_at: {type: timestamptz, nullable: true}
      status: {type: enum, enum: RuleRunStatus}
      config_hash: {type: string}
      candidate_count: {type: integer}
      error_code: {type: string, nullable: true}
  Task:
    status: planned
    planned_stage: B
    table: tasks
    layer: kernel
    fhir: Task
    description: 규칙이 만든 할 일 1건. 같은 대상·같은 회차는 한 번만
    fields:
      rule_id: {type: uuid, references: Rule, relation: createdBy}
      subject_type: {type: string}
      subject_id: {type: uuid}
      dedupe_key: {type: string, unique: true}
      title: {type: string}
      assignee_role: {type: enum, enum: StaffRoleCode}
      opened_at: {type: timestamptz}
      due_at: {type: timestamptz}
      status: {type: enum, enum: TaskStatus}
      resolved_at: {type: timestamptz, nullable: true}
      resolved_by: {type: string, nullable: true}
      condition_cleared_at: {type: timestamptz, nullable: true}
    constraints: [제목은 고정 문구이며 이름·차트번호·결과 금지]
workflow:
  entity: Exam
  stored: false
  derivation:
    - {stage: HANDOFF_PENDING, when: 인계가 필요한 종류(config/ledger_app.yaml handoff=true)이고 위탁일이 없음}
    - {stage: RESULT_PENDING, when: 결과보고일이 없음}
    - {stage: DOCTOR_PENDING, when: 원장 지시가 없음}
    - {stage: FOLLOWUP, when: 재검 계획이 있고 재검 완료일이 없음}
    - {stage: CLOSED, when: 그 밖(재검 불필요 지시 또는 재검 완료)}
  labels:
    HANDOFF_PENDING: 인계 대기
    RESULT_PENDING: 결과 대기
    DOCTOR_PENDING: 원장 지시 대기
    FOLLOWUP: 재검 예정
    CLOSED: 종결
  transitions:
    - {from: '[*]', to: HANDOFF_PENDING, action: register, permission: ledger.register, guard: handoff_required}
    - {from: '[*]', to: RESULT_PENDING, action: register, permission: ledger.register, guard: handoff_not_required}
    - {from: HANDOFF_PENDING, to: RESULT_PENDING, action: handoff, permission: ledger.handoff, guard: bottle_count_matches}
    - {from: RESULT_PENDING, to: DOCTOR_PENDING, action: receive, permission: ledger.result, guard: registered_notation}
    - {from: DOCTOR_PENDING, to: FOLLOWUP, action: decide_required, permission: ledger.decide, guard: doctor_due_date}
    - {from: DOCTOR_PENDING, to: CLOSED, action: decide_not_required, permission: ledger.decide, guard: doctor_reason}
    - {from: FOLLOWUP, to: CLOSED, action: complete_followup, permission: ledger.followup, guard: done_date_not_future}
  guards:
    handoff_required: 종류의 handoff=true
    handoff_not_required: 종류의 handoff=false
    bottle_count_matches: 인계 대기 전체의 장부 병 수와 직원이 센 병 수가 같고 접수인·인계인·인수인이 모두 있음
    registered_notation: 조직검사는 등록 코드 표기, CLO·Stool은 20자 이내 판정. Sydney는 위 검체만
    doctor_due_date: 원장이 정한 재검 날짜가 있음(시스템이 간격을 계산하지 않음)
    doctor_reason: 재검 불필요 사유가 있음. 여러 건 일괄 지시는 하나라도 실패하면 전부 취소
    done_date_not_future: 재검 시행일이 오늘 이전
  imports: 엑셀 가져오기(excel.import)는 새 행만 저장하며, 단계는 가져온 값(위탁일·결과보고일)으로 계산한다
doc_text:
  ontology: |
    실제 운영 흐름(A04~A13)에 맞춘 정식 모델이다. `implemented`는 실제 테이블이 있고 시험(`tests/prototype/test_ontology.py`)이 열·타입·NULL·FK·UNIQUE 일치를 검사한다. `planned`는 표시된 단계에서 구현한다.
  erd: |
    공통 필드(id·created_at·updated_at)는 모든 테이블에 있다. 관계는 각 클래스의 `references` 필드에서 만든다. JSONB 안에 들어가는 구성 요소(ReportFinding·SydneyGrading)와 config 등록값(ResultCode)은 그림에서 뺐다.
  state_machine: |
    단계는 DB에 저장하지 않는다. 연결된 기록(인계·결과·원장 지시·재검 계획)이 있는지로 매번 계산하므로, 상태 값과 실제 기록이 어긋나지 않는다. 화면 버튼은 아래 전이만 허용하고 권한은 `config/security.yaml`을 따른다.
  fhir: |
    참조판: FHIR R4 4.0.1. 아래는 개념 대응이며 FHIR 적합성·profile·변환·서버 구현을 의미하지 않는다(Stage G). [HL7 공식 Resource Index](https://hl7.org/fhir/R4/resourcelist.html)
