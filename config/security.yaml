status: DESIGN_NOT_DEPLOYABLE
authentication:
  password_algorithm: argon2id
  minimum_password_length: 10
  failed_login_limit: 5
  lockout_minutes: 30
  idle_timeout_minutes: 15
  cookies: {secure: true, httponly: true, samesite: Strict}
  csrf: synchronizer_token_and_origin_check
  session_absolute_hours: 12
  # [가정] Q01 확정 전 역할별 권한 초안. PRIVACY_OFFICER만으로는 장부를 볼 수 없다(별도 업무 역할 필요).
  permissions:
    ledger.view: [NURSE, ADMIN, DOCTOR]
    ledger.register: [NURSE, ADMIN, DOCTOR]
    ledger.handoff: [NURSE, ADMIN, DOCTOR]
    ledger.result: [ADMIN, DOCTOR]
    ledger.decide: [DOCTOR, ADMIN]   # ADMIN은 원장 지시의 대리 입력
    ledger.followup: [NURSE, ADMIN, DOCTOR]
    # [가정] 위급치 표기는 관리자 확인 후(B15). 관리자 = ADMIN(사무장), 원장도 가능.
    lab.critical_mark: [ADMIN, DOCTOR]
    excel.import: [ADMIN, DOCTOR]
    excel.export: [ADMIN, DOCTOR]
    privacy.logs: [PRIVACY_OFFICER]
    admin.staff: [PRIVACY_OFFICER]
network:
  # 고시 제6조①1호 접근통제. DB 모드에서 이 대역 밖의 접속은 거부하고 접속기록(DENIED)에 남긴다.
  # 프록시 신뢰 대역과 PC 허용 대역은 별개다. 원내 LAN 공개(Phase 5) 때 실제 대역으로 바꾼다(Q10).
  allowed_client_cidrs:
    - '127.0.0.0/8'       # 서버 PC 자신
    - '::1/128'
    - '172.16.0.0/12'     # Docker 브리지: 지금 장부는 127.0.0.1에만 게시되어 서버 PC 접속이 이 주소로 들어온다
    - '192.168.65.0/24'   # Docker Desktop(Windows) 내부 대역 [확인 필요]
    - '192.168.0.0/24'    # [가정] 원내 업무 PC 대역. 운영 값 아님
  trusted_proxy_cidrs: []
  deny_egress: true
  allow_internal_database: true
retention:
  approval_status: REQUIRES_OWNER_AND_LEGAL_REVIEW
  closed_business_years: 5
  terminal_business_years_proposal: 5
  access_log_minimum_years: 2
  permission_history_minimum_years: 3
  audit_business_years_proposal: 5
  backup_maximum_days: 30
  deletion_ledger_days_after_last_affected_backup_proposal: 30
  live_data_enabled: false
access_review:
  interval: monthly
  bulk_distinct_patients_threshold: 50
  bulk_window_minutes: 10
  status: ASSUMED_THRESHOLDS
import_limits:
  maximum_upload_bytes: 5242880
  maximum_rows: 2000
  maximum_expanded_bytes: 52428800
  preview_ttl_minutes: 15
  spool_to_disk: false
  allow_macros: false
  allow_formulas: false
backup:
  encryption_proposal: age_public_recipient
  private_key_on_server: false
  forbidden_path_components: [OneDrive, Google Drive, GoogleDrive, Dropbox, CloudStorage]
  approved_local_directory_required: true
