version: '0.1-prototype'
status: SYNTHETIC_ONLY
sheet_name: 혈액검체장부
# 2026-10-26 원내 실제 서식(A18). 1행 제목, 2행 열 이름, 3행부터 수진자 1명(접수 1건)당 한 행.
title: 혈액병리검체 접수, 인계, 인수 및 회신결과 대장 (일반<6종.9종>/간)
freeze_panes: E3
key_fields: [report_ref, chart_no]
# 한 수진자가 여러 종류를 함께 받을 수 있어 분류 칸에는 쉼표로 이어 적는다(B07). 추가 간염 검사도 분류에 적는다(B13).
exam_kinds: [일반검진6종, 일반검진9종, 간검진(AFP), 추가b형간염, 추가c형간염]
# 씨젠 결과의 이상 표시를 그대로 옮긴다. 시스템이 참고치와 비교해 새로 판정하지 않는다.
result_flags: [H, L]
# 결과 항목이 있고 모두 정상범위이면 결과란에 적는 표기(B08). 결과 항목이 없으면 빈칸(미수신).
normal_label: 정상
# 결과란 항목명은 원내 약칭으로 적는다(B10). 목록에 없는 이름은 그대로 적고 검토 항목을 만든다.
# 씨젠 Excel 항목명 → 약칭 대응은 B11(씨젠 파일 헤더) 확인 후 L4에서 정한다.
item_names: [Hb, Glu, CHOL, TG, HDL, LDL, AST, ALT, GGT, Cr]
columns:
  - {header: 날짜, field: received_date, kind: date, width: 12}
  - {header: 접수번호, field: report_ref, kind: text, width: 14}
  - {header: 차트번호, field: chart_no, kind: text, width: 12}
  - {header: 성명, field: patient_name, kind: text, width: 14}
  # 성별과 나이를 'F/52'처럼 한 칸에 적는다(L12 확정). 나이는 입력 표기를 그대로 쓰며 생년월일로 계산하지 않는다.
  - {header: 성별/나이, field: sex, kind: sex_age, width: 10}
  - {header: 분류(일반/간), field: exam_kinds, kind: exam_kinds, width: 22}
  - {header: 접수인(서명), kind: manual, width: 13}
  - {header: 위탁날짜, field: entrusted_date, kind: date, width: 12}
  - {header: 인계인(서명), kind: manual, width: 13}
  - {header: 수령인(서명), kind: manual, width: 13}
  - {header: 회신날짜, field: report_date, kind: date, width: 12}
  - {header: 결과, field: items, kind: lab_result, width: 40}
