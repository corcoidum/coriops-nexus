{% extends "ledger_base.html" %}
{% block crumb %}비밀번호 변경{% endblock %}
{% block content %}
    <div class="page-heading"><div><span class="eyebrow">ACCOUNT</span><h1>비밀번호 변경</h1><p>{% if actor.must_change_password %}처음 로그인했거나 비밀번호가 초기화됐습니다. 새 비밀번호를 정해야 업무 화면을 쓸 수 있습니다.{% else %}다른 PC에 남은 로그인은 모두 끊깁니다.{% endif %}</p></div></div>
    <section class="panel excel-card narrow">
      <form action="/account/password" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="current">현재(임시) 비밀번호</label><input id="current" name="current" type="password" maxlength="128" required autocomplete="current-password">
        <label for="new">새 비밀번호</label><input id="new" name="new" type="password" maxlength="128" required minlength="10" autocomplete="new-password">
        <p class="field-help">10자 이상, 아이디를 넣지 않습니다.</p>
        <label for="confirm">새 비밀번호 확인</label><input id="confirm" name="confirm" type="password" maxlength="128" required minlength="10" autocomplete="new-password">
        <button class="button primary full" type="submit">변경</button>
      </form>
    </section>
{% endblock %}
