<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>로그인 · CoriOps Nexus</title><link rel="stylesheet" href="/static/dashboard.css"></head>
<body class="login-body">
<main class="login-card">
  <div class="brand login-brand"><span class="brand-mark">C</span><span>CoriOps<span class="brand-sub">NEXUS</span></span></div>
  <h1>조직검체 장부 로그인</h1>
  <p class="form-intro">개인 계정으로만 로그인합니다. 계정을 함께 쓰지 않습니다.</p>
  {% if notice %}<div class="notice" role="status">{{ notice }}</div>{% endif %}
  {% if error %}<p class="alert-chip danger login-error" role="alert">{{ error }}</p>{% endif %}
  <form action="/login" method="post" autocomplete="off">
    <label for="username">아이디</label><input id="username" name="username" maxlength="30" required autofocus autocapitalize="none" spellcheck="false">
    <label for="password">비밀번호</label><input id="password" name="password" type="password" maxlength="128" required autocomplete="current-password">
    <button class="button primary full" type="submit">로그인</button>
  </form>
  <p class="field-help">5회 연속 틀리면 30분 동안 잠깁니다. 15분 동안 사용하지 않으면 자동으로 로그아웃됩니다.</p>
</main>
</body>
</html>
