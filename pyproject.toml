[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "coriops-nexus"
version = "0.1.0.dev0"
description = "원내 조직검체 업무의 합성 Excel·수동 대시보드 프로토타입"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openpyxl==3.1.5", "PyYAML==6.0.3", "fastapi==0.159.1",
    "uvicorn==0.54.0", "Jinja2==3.1.6", "python-multipart==0.0.32",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "psycopg[binary]==3.2.10", "httpx==0.28.1"]

[tool.setuptools.package-data]
app = ["web/templates/*.html", "web/static/*.css"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests/prototype"]
addopts = "-ra"
