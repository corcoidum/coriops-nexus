name: coriops-nexus-prototype
services:
  postgres-test:
    image: postgres:16.14-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: coriops_test
      POSTGRES_USER: coriops_test
      POSTGRES_PASSWORD: ${CORIOPS_TEST_DB_PASSWORD:-}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [test-internal]
  test:
    build:
      context: .
      dockerfile: Dockerfile.prototype
    image: coriops-nexus-prototype:local
    profiles: [test]
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      PGHOST: postgres-test
      PGPORT: '5432'
      PGDATABASE: coriops_test
      PGUSER: coriops_test
      PGPASSWORD: ${CORIOPS_TEST_DB_PASSWORD:-}
    networks: [test-internal]
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.prototype
    image: coriops-nexus-prototype:local
    profiles: [dashboard]
    ports:
      - '127.0.0.1:8765:8000'
    networks: [dashboard-local]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [python, -m, app.demo_server]
  demo:
    build:
      context: .
      dockerfile: Dockerfile.prototype
    image: coriops-nexus-prototype:local
    profiles: [demo]
    network_mode: none
    volumes:
      - ./outputs:/outputs
    command: [python, -m, app.modules.endoscopy_pathology.ledger_demo, --output, /outputs/01a15ebd-ee2d-7793-a059-7cf7132919ed/ledger-demo.xlsx]
  ledger-db:
    image: postgres:16.14-alpine
    profiles: [ledger]
    environment:
      POSTGRES_DB: coriops
      POSTGRES_USER: coriops
      POSTGRES_PASSWORD: ${CORIOPS_DB_PASSWORD:?CORIOPS_DB_PASSWORD를 .env에 설정하세요}
    volumes:
      - ledger-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [ledger-internal]
  ledger:
    build:
      context: .
      dockerfile: Dockerfile.prototype
    image: coriops-nexus-prototype:local
    profiles: [ledger]
    depends_on:
      ledger-db:
        condition: service_healthy
    environment:
      CORIOPS_DATABASE_URL: 'postgresql+psycopg://'
      PGHOST: ledger-db
      PGPORT: '5432'
      PGDATABASE: coriops
      PGUSER: coriops
      PGPASSWORD: ${CORIOPS_DB_PASSWORD:?CORIOPS_DB_PASSWORD를 .env에 설정하세요}
      CORIOPS_EXPORT_DIR: /exports
    ports:
      - '127.0.0.1:8766:8000'
    volumes:
      # 지정 원내 폴더 하나만 연결한다. 클라우드 동기화 폴더를 지정하지 않는다.
      - ${CORIOPS_EXPORT_HOST_DIR:?CORIOPS_EXPORT_HOST_DIR를 .env에 설정하세요}:/exports
    networks: [dashboard-local, ledger-internal]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [python, -m, app.ledger_server]
networks:
  dashboard-local:
  test-internal:
    internal: true
  ledger-internal:
    internal: true
volumes:
  ledger-data:
